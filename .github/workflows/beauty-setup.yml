name: 美容 初期設定（シート作成・トークン登録）

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: シートを用意
        run: python beauty/src/init_sheet.py
        env:
          SHEET_ID: ${{ secrets.BEAUTY_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Threadsトークンを登録
        run: |
          if [ -z "$THREADS_TOKEN" ]; then
            echo "BEAUTY_THREADS_TOKEN が未登録のため、トークン登録は飛ばします"
            exit 0
          fi
          python beauty/src/setup_token.py --token "$THREADS_TOKEN"
        env:
          SHEET_ID: ${{ secrets.BEAUTY_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          THREADS_TOKEN: ${{ secrets.BEAUTY_THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
