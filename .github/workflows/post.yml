name: Threads 投稿

on:
  schedule:
    # GitHub の定時実行は飛ばされることがあるので、30分ごとに見回って
    # 予定時刻（朝 8:00 / 昼 12:30 / 夜 20:30 JST）を過ぎた承認済みの投稿を拾う
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: 今すぐ投稿する枠（空なら見回り）
        required: false
        type: choice
        options: ["", 朝, 昼, 夜]
      date:
        description: 枠と一緒に使う日付 YYYY-MM-DD（空なら今日）
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: git の設定
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
      - name: 投稿
        run: |
          ARGS=()
          if [ -n "${{ inputs.slot }}" ]; then ARGS+=(--slot "${{ inputs.slot }}"); fi
          if [ -n "${{ inputs.date }}" ]; then ARGS+=(--date "${{ inputs.date }}"); fi
          python src/post.py "${ARGS[@]}"
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
